# The suite on every push (ADR-0041 §5): Linux, compiled with geex's own OTP (the one releases
# carry), with tree_sitter_wasm at the commit mix.exs pins.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch cancels the older run; a tag's run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: geex

      - uses: ./geex/.github/actions/setup
        with:
          key: linux-x64-ubuntu-22.04

      # deps only, not _build: the NIF's .so lives in tree_sitter_wasm's priv/ (gitignored, so
      # not in a fresh checkout), and a cached _build would tell Mix the dependency is compiled,
      # so the NIF would never be built and wouldn't load. Its cargo build is cached by setup.
      - name: Restore deps
        uses: actions/cache@v4
        with:
          path: geex/deps
          key: mix-deps-${{ hashFiles('geex/mix.lock') }}

      # The tree watcher's tests watch a real directory (test_helper.exs leaves them out without
      # inotifywait, but CI should run them).
      - name: inotify-tools
        run: sudo apt-get install -y inotify-tools

      # Tests that commit to a scratch repository need an identity.
      - name: git identity
        run: |
          git config --global user.name "geex CI"
          git config --global user.email "ci@geex.invalid"

      - name: Shell scripts
        working-directory: geex
        run: |
          shellcheck -s sh install.sh rel/smoke.sh
          shellcheck rel/build-runtime.sh
          dash -n install.sh

      - name: Compile
        working-directory: geex
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Test
        working-directory: geex
        run: mix test
